{% extends 'common/base.html' %}

{% block content %}

<div class="help-request-create-container">

    <h1>Create Help Request</h1>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Submit Request
        </button>

    </form>

    <button
        type="button"
        onclick="location.href='{% url 'assistance:help-request-list' %}'">

        Cancel

    </button>

</div>

{% endblock %}
