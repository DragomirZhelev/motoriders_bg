{% extends 'common/base.html' %}

{% block content %}

    <div class="help-request-list-container">

        <h1>Help Requests</h1>

        <p>
            <button type="button" class="btn btn-success"
                    onclick="location.href='{% url 'assistance:help-request-create' %}'">

                Create Help Request

            </button>
        </p>
        <form method="get" class="mb-4">

            <div class="row g-2">

                <div class="col-md-9">

                    <select
                            name="status"
                            class="form-select">

                        <option value="">
                            All Help Requests
                        </option>

                        <option value="Open">
                            Open Help Requests
                        </option>

                        <option value="Closed">
                            Closed Help Requests
                        </option>

                    </select>

                </div>

                <div class="col-md-3">

                    <button
                            type="submit"
                            class="btn btn-info w-100">

                        Filter

                    </button>

                </div>

            </div>

        </form>

        {% if help_requests %}

            {% for help_request in help_requests %}

                {% include 'assistance/help-request-card.html' %}

            {% endfor %}

        {% else %}

            <p>No help requests available.</p>

        {% endif %}

    </div>

{% endblock %}
