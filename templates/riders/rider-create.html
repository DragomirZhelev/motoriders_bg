{% extends 'common/base.html' %}

{% block content %}

{% include 'common/model-form-styles.html' %}

<div class="model-form-page rider-create-container">
    <div class="card model-form-card bg-dark text-light border-secondary shadow-lg">
        <div class="card-header px-4 py-3">
            <h1 class="h3 mb-0">Create Rider Profile</h1>
            <p class="text-secondary mb-0 mt-2">Add rider and motorcycle details to the community.</p>
        </div>
        <div class="card-body p-4">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="d-flex flex-wrap gap-2 pt-2">
                    <button type="submit" class="btn btn-danger">Create Rider</button>
                    <a href="{% url 'riders:rider-list' %}" class="btn btn-outline-light">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
