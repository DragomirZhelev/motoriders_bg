{% extends 'common/base.html' %}

{% block content %}



    <h1>All Riders</h1>
    <p>
        <button type="button" class="btn btn-success" onclick="location.href='{% url 'riders:rider-create' %}'">
            Create a New Rider
        </button>
    </p>
    <form method="get" class="mb-4">

        <div class="row g-2">

            <div class="col-md-8">

                <input
                        type="text"
                        name="search"
                        class="form-control"
                        placeholder="Search by first name, last name or nickname"
                        value="{{ request.GET.search|default:'' }}"
                >

            </div>

            <div class="col-md-4">

                <button
                        type="submit"
                        class="btn btn-info w-100">

                    Search

                </button>

            </div>

        </div>

    </form>
    {% if riders %}
        {% for rider in riders %}
            {% include 'riders/rider-card.html' %}
            <hr>
        {% endfor %}
    {% else %}
        <p>No riders yet.</p>
    {% endif %}

{% endblock %}
