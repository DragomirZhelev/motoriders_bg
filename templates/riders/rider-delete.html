{% extends 'common/base.html' %}

{% block content %}

<div class="rider-delete-container">

    <h1>Delete Rider</h1>

    <p>Are you sure you want to delete this rider profile?</p>

    <div>
        <p>
            <strong>{{ rider.full_name }}</strong>
        </p>

        <p>
            Nickname: {{ rider.nickname }}
        </p>
    </div>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">
            Confirm Delete
        </button>
    </form>

    <a href='{% url 'riders:rider-details' rider.pk %}'>
        Cancel
    </a>

</div>

{% endblock %}
