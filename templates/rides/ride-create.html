{% extends 'common/base.html' %}

{% block content %}

<div class="ride-create-container">

    <h1>Create Ride</h1>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Create Ride
        </button>

    </form>

    <button
        type="button"
        onclick="location.href='{% url 'rides:ride-list' %}'">

        Cancel

    </button>

</div>

{% endblock %}
