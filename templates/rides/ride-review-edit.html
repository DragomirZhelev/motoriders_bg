{% extends 'common/base.html' %}

{% block content %}

<div class="ride-review-edit-container">

    <h1>Edit Ride Review</h1>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Save Changes
        </button>
    </form>

    <a href='{% url 'rides:ride-review-details' ride_review.pk %}'>

        Cancel

    </a>

</div>

{% endblock %}
