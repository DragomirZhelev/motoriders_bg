{% extends 'common/base.html' %}

{% block content %}

<div class="ride-review-delete-container">

    <h1>Delete Ride Review</h1>

    <p>Are you sure you want to delete this ride review?</p>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Confirm Delete
        </button>
    </form>

    <button
        type="button"
        onclick="location.href='{% url 'rides:ride-review-details' ride_review.pk %}'">

        Cancel

    </button>

</div>

{% endblock %}
