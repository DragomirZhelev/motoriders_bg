{% extends 'common/base.html' %}

{% block content %}

<div class="ride-review-list-container">

    <h1>Ride Reviews</h1>

    <p>
    <button
        type="button" class="btn btn-success"
        onclick="location.href='{% url 'rides:ride-review-create' %}'">

        Create Ride Review

    </button>
    </p>
    <form method="get" class="mb-4">

    <div class="row g-2">

        <div class="col-md-9">

            <input
                    type="text"
                    name="search"
                    class="form-control"
                    placeholder="Search by Ride title or reviewer name"
                    value="{{ request.GET.search|default:'' }}"
            >

        </div>

        <div class="col-md-3">

            <button
                    type="submit"
                    class="btn btn-info w-100">

                Search

            </button>

        </div>

    </div>

</form>



    {% if ride_reviews %}

        {% for ride_review in ride_reviews %}

            {% include 'rides/ride-review-card.html' %}

        {% endfor %}

    {% else %}

        <p>No ride reviews available.</p>

    {% endif %}

</div>

{% endblock %}
