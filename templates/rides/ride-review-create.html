{% extends 'common/base.html' %}

{% block content %}

<div class="review-create-container">

    <h1>Create Ride Review</h1>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Submit Review
        </button>
    </form>

    <button
        type="button"
        onclick="location.href='{% url 'rides:ride-review-list' %}'">

        Cancel

    </button>

</div>

{% endblock %}
