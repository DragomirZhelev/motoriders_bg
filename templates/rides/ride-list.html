{% extends 'common/base.html' %}

{% block content %}

    <div class="ride-list-container">


        <h1>All Rides</h1>
        <p>
            <button type='button' class="btn btn-success" onclick="location.href='{% url 'rides:ride-create' %}'">
                Create a New Ride
            </button>
        </p>

        <form method="get" class="mb-4">

            <div class="row g-2">

                <div class="col-md-5">

                    <input
                            type="text"
                            name="search"
                            class="form-control"
                            placeholder="Search rides..."
                            value="{{ request.GET.search|default:'' }}"
                    >

                </div>

                <div class="col-md-3">

                    <select
                            name="status"
                            class="form-select">

                        <option value="">
                            All Statuses
                        </option>

                        <option value="Planned">
                            Planned
                        </option>

                        <option value="Completed">
                            Completed
                        </option>

                        <option value="Canceled">
                            Canceled
                        </option>

                    </select>

                </div>

                <div class="col-md-2">

                    <select
                            name="sort"
                            class="form-select">

                        <option value="">
                            Default Sorting
                        </option>

                        <option value="latest">
                            Latest Rides
                        </option>

                        <option value="oldest">
                            Oldest Rides
                        </option>

                    </select>

                </div>

                <div class="col-md-2">

                    <button
                            type="submit"
                            class="btn btn-info w-100">

                        Search

                    </button>

                </div>

            </div>

        </form>

        {% if rides %}

            {% for ride in rides %}

                {% include 'rides/ride-card.html' %}

            {% endfor %}

        {% else %}

            <p>No rides available.</p>

        {% endif %}

    </div>

{% endblock %}
