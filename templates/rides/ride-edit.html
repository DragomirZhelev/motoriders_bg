{% extends 'common/base.html' %}

{% block content %}

{% include 'common/model-form-styles.html' %}

<div class="model-form-page ride-edit-container">
    <div class="card model-form-card bg-dark text-light border-secondary shadow-lg">
        <div class="card-header px-4 py-3">
            <h1 class="h3 mb-0">Edit Ride</h1>
            <p class="text-secondary mb-0 mt-2">Update the route, schedule, or ride details.</p>
        </div>
        <div class="card-body p-4">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="d-flex flex-wrap gap-2 pt-2">
                    <button type="submit" class="btn btn-danger">Save Changes</button>
                    <a href="{% url 'rides:ride-details' ride.pk %}" class="btn btn-outline-light">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
